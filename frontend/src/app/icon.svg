<!--
  Browser-tab icon. Next.js App Router picks up `src/app/icon.svg`
  automatically — no <link rel="icon"> needed in layout.tsx.

  This is a deliberately reduced version of the mascot in
  components/features/art/DuoOwl.tsx: at 16px the full drawing (wings,
  belly, tufts, pupil glints) collapses into mush, so the favicon keeps
  only the three shapes that still read at that size — green ground, two
  white eyes, orange beak.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#58CC02"/>
  <circle cx="23" cy="26" r="12" fill="#fff"/>
  <circle cx="41" cy="26" r="12" fill="#fff"/>
  <circle cx="25" cy="28" r="5.5" fill="#4B4B4B"/>
  <circle cx="39" cy="28" r="5.5" fill="#4B4B4B"/>
  <path d="M32 36c6 0 10 3.4 10 7.5S37.5 51 32 51s-10-3.4-10-7.5S26 36 32 36Z" fill="#FFC800"/>
  <path d="M22.3 45.5C23.7 49 27.4 51 32 51s8.3-2 9.7-5.5Z" fill="#FF9600"/>
</svg>
